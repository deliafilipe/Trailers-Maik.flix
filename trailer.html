<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Maik.Flix trailer</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #p { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="p"></div>
<script>
  function param(n) { var m = location.search.match(new RegExp("[?&]" + n + "=([^&]*)")); return m ? decodeURIComponent(m[1]) : ""; }
  var videoId = param("v"), vol = parseInt(param("vol"), 10) || 45, player = null;
  function send(m) { try { parent.postMessage(JSON.stringify(m), "*"); } catch (e) {} }
  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("p", {
      videoId: videoId, width: "100%", height: "100%",
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1, playsinline: 1, rel: 0, cc_load_policy: 0, hl: "pt-BR", origin: location.protocol + "//" + location.host },
      events: {
        onReady: function (e) { e.target.setVolume(vol); e.target.playVideo(); },
        onStateChange: function (e) { send({ flix: "state", s: e.data }); },
        onError: function (e) { send({ flix: "error", e: e.data }); }
      }
    });
  };
  window.addEventListener("message", function (e) {
    var d; try { d = JSON.parse(e.data); } catch (x) { return; }
    if (d && d.flix === "mute" && player) { player.mute(); player.playVideo(); }
  });
</script>
</body>
</html>
