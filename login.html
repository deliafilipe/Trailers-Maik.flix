<script>
  // ======== CONFIGURAÇÃO (preencha com os dados do seu projeto Supabase) ========
  var SUPABASE_URL = "https://titaxncpdzztpewuoacl.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_W9sooeSKntQAphJxGBE6Cg_wMrOJ2gz";
  // ==============================================================================
  var G = '<svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.7-.4-3.9z"/></svg>';
  var CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var v = document.getElementById("v");
  function q(n, s) { var m = (s || location.search).match(new RegExp("[?&#]" + n + "=([^&]*)")); return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : ""; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function jwt(t) { try { return JSON.parse(decodeURIComponent(escape(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))))); } catch (e) { return {}; } }
  var pid = q("p");
  var hash = location.hash || "";
  if (!/^[A-Za-z0-9]{20,64}$/.test(pid)) {
    v.innerHTML = "<h1>Abra pelo QR code</h1><p>Esta página é aberta pelo QR code que aparece na TV (ou pelo botão “Entrar com Google” no app do celular).</p>";
  } else if (/access_token=/.test(hash)) {
    var at = q("access_token", hash), rt = q("refresh_token", hash), info = jwt(at), md = info.user_metadata || {};
    var who = md.full_name || md.name || info.email || "";
    history.replaceState(null, "", location.pathname + "?p=" + pid);
    v.innerHTML = '<div class="spin"></div><p style="margin-top:18px">Conectando o Maik.Flix…</p>';
    fetch(SUPABASE_URL + "/rest/v1/rpc/pair_put", {
      method: "POST",
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + at, "Content-Type": "application/json" },
      body: JSON.stringify({ pid: pid, token: rt })
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      v.innerHTML = '<div class="ok">' + CHECK + "</div><h1>Pronto" + (who ? ", " + esc(who.split(" ")[0]) : "") + "!</h1>" +
        "<p>Pode voltar para o Maik.Flix — ele conecta sozinho em alguns segundos.</p>" +
        (info.email ? '<p class="small">Conta: ' + esc(info.email) + "</p>" : "");
    }).catch(function (e) {
      v.innerHTML = '<h1 class="err">Não deu certo</h1><p>Não consegui avisar o app (' + esc(e.message) + "). Gere um QR code novo e tente de novo.</p>";
    });
  } else if (/error/.test(hash) || q("error")) {
    v.innerHTML = '<h1 class="err">Login cancelado</h1><p>' + esc(q("error_description", hash) || q("error_description") || "Tente de novo.") + "</p>";
    v.innerHTML += '<button class="g" id="go">' + G + "Tentar de novo</button>";
    document.getElementById("go").onclick = login;
  } else {
    v.innerHTML = "<h1>Entre para salvar seu histórico</h1><p>Seu progresso, a Minha Lista e os perfis ficam guardados na sua conta Google — em qualquer TV ou celular.</p>" +
      '<button class="g" id="go">' + G + "Entrar com Google</button>" +
      '<p class="small">O Maik.Flix só recebe seu nome e e-mail.</p>';
    document.getElementById("go").onclick = login;
  }
  function login() {
    var back = location.origin + location.pathname + "?p=" + pid;
    location.href = SUPABASE_URL + "/auth/v1/authorize?provider=google&redirect_to=" + encodeURIComponent(back);
  }
</script>
